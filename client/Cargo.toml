[package]
name = "cesi_go"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cesi_go"
path = "src/main.rs"

[dependencies]
cesi_common = { path = "../common" }
cesi_server = { path = "../server" }
macroquad = { version = "0.4.16", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
